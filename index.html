<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>9ft Billiards Layout Editor</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #121212;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
      background: #121212;
      font-family: sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    h1 {
      font-size: 1rem;
      margin: 2px 0 6px;
      color: #ddd;
      text-align: center;
      flex-shrink: 0;
    }

    /* 木目調レール（木枠全体の比率 50:27） */
    .wood-rail {
      width: min(94vw, calc((100dvh - 130px) * (50 / 27)));
      max-width: 720px;
      aspect-ratio: 50 / 27;
      background: #3e2312;
      background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 10px);
      border-radius: 10px;
      padding: 4%;
      position: relative;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* プレイエリア（ラシャ）のアスペクト比 2 : 1 */
    #table-canvas {
      width: 100%;
      aspect-ratio: 2 / 1;
      background: #009a7b;
      position: relative;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.7);
      overflow: visible;
      border-radius: 2px;
      touch-action: none;
    }

    .cushion-shadow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
      z-index: 3;
      border-radius: 2px;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-size: calc(100% / 16) calc(100% / 8);
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.18) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.18) 1px, transparent 1px);
      z-index: 2;
    }

    .table-spot {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 2px rgba(0,0,0,0.6);
      pointer-events: none;
      z-index: 3;
    }
    .head-spot { left: 25%; top: 50%; }
    .foot-spot { left: 75%; top: 50%; }

    .diamond {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #ffffff;
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
      z-index: 15;
      pointer-events: none;
    }

    .pocket {
      position: absolute;
      background: #0a0a0a;
      border-radius: 50%;
      box-shadow: inset 0 0 8px #000000, 0 0 3px rgba(0,0,0,0.8);
      z-index: 1;
      transform: translate(-50%, -50%);
    }
    .pocket.corner { width: 8.5%; aspect-ratio: 1; }
    .pocket.side { width: 7.5%; aspect-ratio: 1; }

    .p-tl { top: -1%; left: -1%; }
    .p-tr { top: -1%; left: 101%; }
    .p-bl { top: 101%; left: -1%; }
    .p-br { top: 101%; left: 101%; }
    .p-tc { top: -2.5%; left: 50%; }
    .p-bc { top: 102.5%; left: 50%; }

    .ball {
      width: 5.5%; aspect-ratio: 1; border-radius: 50%; position: absolute;
      transform: translate(-50%, -50%); cursor: grab; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 0.7rem; user-select: none; box-shadow: 2px 2px 4px rgba(0,0,0,0.5); z-index: 10;
      touch-action: none;
      will-change: left, top;
      transition: left 0.1s ease-out, top 0.1s ease-out;
    }

    .ball.is-dragging {
      transition: none !important;
      scale: 1.15;
      z-index: 100;
      cursor: grabbing;
    }

    .b-0 { background: #ffffff; color: #000; }
    .b-1 { background: #f1c40f; color: #000; }
    .b-2 { background: #2980b9; color: #fff; }
    .b-3 { background: #e74c3c; color: #fff; }
    .b-4 { background: #8e44ad; color: #fff; }
    .b-5 { background: #e67e22; color: #fff; }
    .b-6 { background: #27ae60; color: #fff; }
    .b-7 { background: #7f8c8d; color: #fff; }
    .b-8 { background: #111111; color: #fff; border: 1px solid #444; }
    .b-9 { background: repeating-linear-gradient(0deg, #f1c40f, #f1c40f 35%, #fff 35%, #fff 65%, #f1c40f 65%); color: #000; }

    /* パネルヘッダー共通スタイル */
    .panel-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding-bottom: 3px;
      border-bottom: 1px solid #444;
    }
    .panel-title { font-size: 0.65rem; color: #ccc; font-weight: bold; }
    .close-btn {
      background: transparent !important;
      border: none !important;
      color: #aaa !important;
      font-size: 0.85rem !important;
      padding: 0 4px !important;
      cursor: pointer;
      line-height: 1;
      width: auto !important;
    }
    .close-btn:active { color: #fff !important; }

    .rack-container {
      margin-top: 6px;
      width: min(94vw, calc((100dvh - 130px) * (50 / 27)));
      max-width: 720px;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 8px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }
    /* 縦画面時はパネルヘッダーを非表示 */
    .rack-container .panel-header { display: none; }

    .rack-title { font-size: 0.72rem; color: #aaa; margin-bottom: 3px; text-align: center; }
    #ball-rack { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 28px; align-items: center; }
    .rack-ball { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.68rem; cursor: pointer; box-shadow: 1px 1px 3px rgba(0,0,0,0.4); user-select: none; }

    .controls { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; flex-shrink: 0; }
    .controls .panel-header { display: none; }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .toggle-label input { accent-color: #27ae60; width: 13px; height: 13px; cursor: pointer; }
    select {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.75rem;
      outline: none;
    }
    button { padding: 4px 10px; font-size: 0.75rem; border: none; border-radius: 4px; background: #c0392b; color: white; cursor: pointer; font-weight: bold; }
    button:active { opacity: 0.8; }

    /* 横画面用のトリガーボタン */
    .drawer-btn { display: none; }

    /* 横画面時のスタイル */
    @media (orientation: landscape) {
      body {
        justify-content: center;
        align-items: center;
        overflow: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      h1 { display: none; }

      /* 台（画面全体限界まで最大化） */
      .wood-rail {
        --avail-w: calc(100dvw - env(safe-area-inset-left) - env(safe-area-inset-right));
        --avail-h: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        
        width: min(var(--avail-w), calc(var(--avail-h) * (50 / 27)));
        max-width: none;
        margin: auto;
        z-index: 1;
      }

      /* 横画面用開くボタン */
      .drawer-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 30;
        background: rgba(40, 40, 40, 0.85);
        color: #fff;
        border: 1px solid #666;
        padding: 8px 6px;
        font-size: 0.65rem;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        user-select: none;
      }

      #btn-toggle-rack { left: max(4px, env(safe-area-inset-left)); }
      #btn-toggle-controls { right: max(4px, env(safe-area-inset-right)); }

      /* パネル内ヘッダーを横画面時のみ表示 */
      .rack-container .panel-header,
      .controls .panel-header {
        display: flex;
      }
      .rack-title { display: none; } /* 縦画面用の重複タイトルを消す */

      /* 左スライドパネル（ボールラック） */
      .rack-container {
        position: absolute;
        left: max(4px, env(safe-area-inset-left));
        top: 50%;
        transform: translateY(-50%) translateX(-130%);
        transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
        width: 80px;
        margin-top: 0;
        padding: 6px 5px;
        background: rgba(25, 25, 25, 0.94);
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 16px rgba(0,0,0,0.7);
        border: 1px solid #555;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .rack-container.is-open {
        transform: translateY(-50%) translateX(0);
      }
      #ball-rack { width: 100%; gap: 4px; justify-content: center; }
      .rack-ball { width: 22px; height: 22px; font-size: 0.6rem; }

      /* 右スライドパネル（設定操作） */
      .controls {
        position: absolute;
        right: max(4px, env(safe-area-inset-right));
        top: 50%;
        transform: translateY(-50%) translateX(130%);
        transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
        width: 115px;
        margin-top: 0;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        background: rgba(25, 25, 25, 0.94);
        backdrop-filter: blur(8px);
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #555;
        box-shadow: 0 4px 16px rgba(0,0,0,0.7);
        z-index: 20;
      }
      .controls.is-open {
        transform: translateY(-50%) translateX(0);
      }
      .toggle-label {
        font-size: 0.65rem;
        padding: 3px 5px;
        justify-content: space-between;
      }
      select {
        font-size: 0.65rem;
        width: 100%;
      }
      button {
        font-size: 0.65rem;
        padding: 4px 5px;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>9ft Billiards Layout Editor</h1>

  <!-- 横画面用開くボタン -->
  <div class="drawer-btn" id="btn-toggle-rack" onclick="toggleRack()">ラック ❯</div>
  <div class="drawer-btn" id="btn-toggle-controls" onclick="toggleControls()">❮ 設定</div>

  <div class="wood-rail" id="wood-rail">
    <div id="table-canvas">
      <div id="diamonds-layer"></div>
      <div class="cushion-shadow"></div>
      <div class="grid-overlay" id="grid-overlay"></div>
      
      <div class="table-spot head-spot"></div>
      <div class="table-spot foot-spot"></div>

      <div class="pocket corner p-tl"></div>
      <div class="pocket side p-tc"></div>
      <div class="pocket corner p-tr"></div>
      <div class="pocket corner p-bl"></div>
      <div class="pocket side p-bc"></div>
      <div class="pocket corner p-br"></div>
    </div>
  </div>

  <!-- ボールラックパネル -->
  <div class="rack-container" id="rack-panel">
    <div class="panel-header">
      <span class="panel-title">ラック</span>
      <button class="close-btn" onclick="toggleRack()">✕</button>
    </div>
    <div class="rack-title">ボールラック</div>
    <div id="ball-rack"></div>
  </div>

  <!-- 設定パネル -->
  <div class="controls" id="controls-panel">
    <div class="panel-header">
      <span class="panel-title">設定・操作</span>
      <button class="close-btn" onclick="toggleControls()">✕</button>
    </div>

    <label class="toggle-label">
      <input type="checkbox" id="snap-toggle" onchange="toggleSnap(this.checked)">
      <span>グリッド吸着</span>
    </label>

    <label class="toggle-label">
      <span>精度:</span>
      <select id="grid-density" onchange="updateGridDensity(this.value)">
        <option value="1">1ダイヤ (8×4)</option>
        <option value="0.5" selected>0.5ダイヤ (16×8)</option>
        <option value="0.25">0.25ダイヤ (32×16)</option>
      </select>
    </label>

    <button onclick="resetToDefault()">初期配置に戻す</button>
  </div>

  <script>
    const tableCanvas = document.getElementById('table-canvas');
    const diamondsLayer = document.getElementById('diamonds-layer');
    const gridOverlay = document.getElementById('grid-overlay');
    const ballRack = document.getElementById('ball-rack');
    const rackPanel = document.getElementById('rack-panel');
    const controlsPanel = document.getElementById('controls-panel');
    const btnToggleRack = document.getElementById('btn-toggle-rack');
    const btnToggleControls = document.getElementById('btn-toggle-controls');
    
    let activeBall = null;
    let isSnapEnabled = false;
    let gridStep = 0.5;

    let rAFId = null;
    let targetPos = { x: 0, y: 0, rawX: 0, rawY: 0 };

    const ballConfigs = [
      { id: 0, text: '手', class: 'b-0' }, { id: 1, text: '1', class: 'b-1' }, { id: 2, text: '2', class: 'b-2' }, { id: 3, text: '3', class: 'b-3' },
      { id: 4, text: '4', class: 'b-4' }, { id: 5, text: '5', class: 'b-5' }, { id: 6, text: '6', class: 'b-6' }, { id: 7, text: '7', class: 'b-7' },
      { id: 8, text: '8', class: 'b-8' }, { id: 9, text: '9', class: 'b-9' }
    ];

    /* パネル開閉関数（パネルが開いた時は外側ボタンを自動非表示） */
    function toggleRack() {
      const isOpen = rackPanel.classList.toggle('is-open');
      btnToggleRack.style.display = isOpen ? 'none' : 'flex';
    }

    function toggleControls() {
      const isOpen = controlsPanel.classList.toggle('is-open');
      btnToggleControls.style.display = isOpen ? 'none' : 'flex';
    }

    function createDiamonds() {
      diamondsLayer.innerHTML = '';

      for (let i = 1; i < 8; i++) {
        const xPct = (100 / 8) * i;
        addDiamond(diamondsLayer, `${xPct}%`, '-7px');
        addDiamond(diamondsLayer, `${xPct}%`, 'calc(100% + 7px)');
      }
      for (let i = 1; i < 4; i++) {
        const yPct = (100 / 4) * i;
        addDiamond(diamondsLayer, '-7px', `${yPct}%`);
        addDiamond(diamondsLayer, 'calc(100% + 7px)', `${yPct}%`);
      }
    }

    function addDiamond(container, x, y) {
      const diamond = document.createElement('div');
      diamond.className = 'diamond';
      diamond.style.left = x;
      diamond.style.top = y;
      container.appendChild(diamond);
    }

    function toggleSnap(enabled) { isSnapEnabled = enabled; }

    function updateGridDensity(value) {
      gridStep = parseFloat(value);
      const cols = 8 / gridStep;
      const rows = 4 / gridStep;
      gridOverlay.style.backgroundSize = `calc(100% / ${cols}) calc(100% / ${rows})`;
    }

    function getSnappedPosition(x, y) {
      const cols = 8 / gridStep;
      const rows = 4 / gridStep;
      const stepX = 100 / cols;
      const stepY = 100 / rows;
      return {
        x: Math.round(x / stepX) * stepX,
        y: Math.round(y / stepY) * stepY
      };
    }

    function init() {
      createDiamonds();
      updateGridDensity(document.getElementById('grid-density').value);
      resetToDefault();
    }

    function resetToDefault() {
      document.querySelectorAll('#table-canvas .ball').forEach(b => b.remove());
      spawnBallOnTable(0, 25, 50);
      spawnBallOnTable(1, 75, 50);
      renderRack();
    }

    function spawnBallOnTable(id, xPercent, yPercent) {
      let ball = document.getElementById(`ball-${id}`);
      if (!ball) {
        const conf = ballConfigs.find(b => b.id === id);
        ball = document.createElement('div');
        ball.id = `ball-${id}`;
        ball.className = `ball ${conf.class}`;
        ball.innerText = conf.text;
        ball.dataset.id = id;
        ball.addEventListener('mousedown', startDrag);
        ball.addEventListener('touchstart', startDrag, { passive: false });
      }

      if (isSnapEnabled) {
        const snapped = getSnappedPosition(xPercent, yPercent);
        xPercent = snapped.x;
        yPercent = snapped.y;
      }

      ball.style.left = `${xPercent}%`;
      ball.style.top = `${yPercent}%`;
      tableCanvas.appendChild(ball);
      renderRack();
    }

    function renderRack() {
      ballRack.innerHTML = '';
      ballConfigs.forEach(conf => {
        const isOnTable = document.getElementById(`ball-${conf.id}`);
        if (!isOnTable) {
          const rackBall = document.createElement('div');
          rackBall.className = `rack-ball ${conf.class}`;
          rackBall.innerText = conf.text;
          rackBall.onclick = () => spawnBallOnTable(conf.id, 50, 50);
          ballRack.appendChild(rackBall);
        }
      });
    }

    function startDrag(e) {
      if (e.cancelable) e.preventDefault();
      activeBall = e.target;
      activeBall.classList.add('is-dragging');

      updatePosition(e);

      document.addEventListener('mousemove', drag, { passive: false });
      document.addEventListener('touchmove', drag, { passive: false });
      document.addEventListener('mouseup', stopDrag);
      document.addEventListener('touchend', stopDrag);
      document.addEventListener('touchcancel', stopDrag);
    }

    function updatePosition(e) {
      if (!activeBall) return;
      const rect = tableCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let rawX = ((clientX - rect.left) / rect.width) * 100;
      let rawY = ((clientY - rect.top) / rect.height) * 100;

      let x = rawX;
      let y = rawY;

      if (isSnapEnabled) {
        const snapped = getSnappedPosition(x, y);
        x = snapped.x;
        y = snapped.y;
      } else {
        x = Math.max(3, Math.min(97, x));
        y = Math.max(5, Math.min(95, y));
      }

      targetPos = { x, y, rawX, rawY };
    }

    function drag(e) {
      if (!activeBall) return;
      if (e.cancelable) e.preventDefault();

      updatePosition(e);

      if (targetPos.rawX < -8 || targetPos.rawX > 108 || targetPos.rawY < -12 || targetPos.rawY > 112) {
        activeBall.remove();
        stopDrag();
        renderRack();
        return;
      }

      if (!rAFId) {
        rAFId = requestAnimationFrame(renderBall);
      }
    }

    function renderBall() {
      if (activeBall) {
        activeBall.style.left = `${targetPos.x}%`;
        activeBall.style.top = `${targetPos.y}%`;
      }
      rAFId = null;
    }

    function stopDrag() {
      if (activeBall) {
        activeBall.classList.remove('is-dragging');
        activeBall = null;
      }
      if (rAFId) {
        cancelAnimationFrame(rAFId);
        rAFId = null;
      }
      document.removeEventListener('mousemove', drag);
      document.removeEventListener('touchmove', drag);
      document.removeEventListener('mouseup', stopDrag);
      document.removeEventListener('touchend', stopDrag);
      document.removeEventListener('touchcancel', stopDrag);
    }

    window.onload = init;
  </script>
</body>
</html>
