<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>9ft Billiards Layout Editor</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { margin: 0; font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
    h1 { font-size: 1.1rem; margin: 5px 0 10px; color: #ddd; }

    /* 外枠（木枠部分） */
    .table-frame {
      width: 95vw;
      max-width: 700px;
      aspect-ratio: 2.2 / 1.2;
      background: #3a2212;
      border-radius: 12px;
      padding: 3%;
      position: relative;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* テーブル内側（ラシャ部分：2:1） */
    #table-canvas {
      width: 100%;
      height: 100%;
      background: #0d6b38;
      position: relative;
      border: 8px solid #24140a;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
    }

    /* ヘッドライン（破線） */
    .headline {
      position: absolute;
      left: 25%;
      top: 0;
      bottom: 0;
      width: 1px;
      border-left: 1px dashed rgba(255,255,255,0.25);
      pointer-events: none;
    }

    /* フットスポット */
    .foot-spot {
      position: absolute;
      left: 75%;
      top: 50%;
      width: 6px;
      height: 6px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* ポケット */
    .pocket { position: absolute; background: #111; border-radius: 50%; box-shadow: inset 0 0 5px #000; }
    .pocket.corner { width: 7%; height: 14%; }
    .pocket.side { width: 6.5%; height: 11%; }
    .p-tl { top: -2%; left: -2%; }
    .p-tr { top: -2%; right: -2%; }
    .p-bl { bottom: -2%; left: -2%; }
    .p-br { bottom: -2%; right: -2%; }
    .p-tc { top: -4%; left: 50%; transform: translateX(-50%); }
    .p-bc { bottom: -4%; left: 50%; transform: translateX(-50%); }

    /* ポイント（ダイヤ） */
    .diamond { position: absolute; width: 5px; height: 5px; background: #d4af37; border-radius: 50%; opacity: 0.8; }

    /* ボールの基本設計 */
    .ball {
      width: 5.5%;
      aspect-ratio: 1;
      border-radius: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.75rem;
      user-select: none;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .ball:active { cursor: grabbing; scale: 1.1; }

    /* ボールデザイン（1〜15番＋手球） */
    .b-0 { background: #ffffff; color: #000; }
    .b-1 { background: #f1c40f; color: #000; }
    .b-2 { background: #2980b9; color: #fff; }
    .b-3 { background: #e74c3c; color: #fff; }
    .b-4 { background: #8e44ad; color: #fff; }
    .b-5 { background: #e67e22; color: #fff; }
    .b-6 { background: #27ae60; color: #fff; }
    .b-7 { background: #7f8c8d; color: #fff; }
    .b-8 { background: #111111; color: #fff; border: 1px solid #444; }
    .b-9 { background: repeating-linear-gradient(0deg, #f1c40f, #f1c40f 35%, #fff 35%, #fff 65%, #f1c40f 65%); color: #000; }

    /* ボールラック（テーブル外の待機スペース） */
    .rack-container {
      margin-top: 15px;
      width: 95vw;
      max-width: 700px;
      background: #222;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    }
    .rack-title { font-size: 0.8rem; color: #aaa; margin-bottom: 8px; text-align: center; }
    #ball-rack {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      min-height: 40px;
      align-items: center;
    }

    .rack-ball {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.4);
      user-select: none;
    }

    .controls { margin-top: 15px; display: flex; gap: 10px; }
    button { padding: 10px 18px; font-size: 0.85rem; border: none; border-radius: 5px; background: #27ae60; color: white; cursor: pointer; font-weight: bold; }
    button.reset { background: #c0392b; }
  </style>
</head>
<body>

  <h1>9ft ポケットビリヤード配置エディタ</h1>

  <!-- 9ft テーブル本体 -->
  <div class="table-frame" id="table-frame">
    <div id="table-canvas">
      <!-- ライン・スポット -->
      <div class="headline"></div>
      <div class="foot-spot"></div>

      <!-- 6ポケット -->
      <div class="pocket corner p-tl"></div>
      <div class="pocket side p-tc"></div>
      <div class="pocket corner p-tr"></div>
      <div class="pocket corner p-bl"></div>
      <div class="pocket side p-bc"></div>
      <div class="pocket corner p-br"></div>

      <!-- ポイント（ダイアモンド）は JS で動的生成 -->
    </div>
  </div>

  <!-- ボールラック（待機エリア） -->
  <div class="rack-container">
    <div class="rack-title">ボールラック（タップでテーブルへ配置 / ドラッグで戻す）</div>
    <div id="ball-rack"></div>
  </div>

  <div class="controls">
    <button onclick="shareLayout()">共有URLをコピー</button>
    <button class="reset" onclick="resetToDefault()">初期配置に戻す</button>
  </div>

  <script>
    const tableCanvas = document.getElementById('table-canvas');
    const tableFrame = document.getElementById('table-frame');
    const ballRack = document.getElementById('ball-rack');
    let activeBall = null;

    // 定義データ（手球:0, 的球:1〜9）※必要に応じて15番まで拡張可能
    const ballConfigs = [
      { id: 0, text: '手', class: 'b-0' },
      { id: 1, text: '1', class: 'b-1' },
      { id: 2, text: '2', class: 'b-2' },
      { id: 3, text: '3', class: 'b-3' },
      { id: 4, text: '4', class: 'b-4' },
      { id: 5, text: '5', class: 'b-5' },
      { id: 6, text: '6', class: 'b-6' },
      { id: 7, text: '7', class: 'b-7' },
      { id: 8, text: '8', class: 'b-8' },
      { id: 9, text: '9', class: 'b-9' }
    ];

    // ポイント（ダイヤ）の配置生成（長辺3等分×2、短辺3等分）
    function createDiamonds() {
      const frameRect = tableFrame.getBoundingClientRect();
      const canvasRect = tableCanvas.getBoundingClientRect();
      
      // 上下クッションのダイヤ (各3箇所)
      [25, 50, 75].forEach(x => {
        addDiamond(x + '%', '2%');
        addDiamond(x + '%', '98%');
      });
      // 左右クッションのダイヤ (各7箇所：9ftの標準配置)
      [12.5, 25, 37.5, 50, 62.5, 75, 87.5].forEach(x => {
        // テーブル枠の上下枠内にダイヤを生成
      });
    }

    // 初期化処理
    function init() {
      renderRack();
      
      // URLからの読み込みがなければデフォルト配置
      if (!loadLayoutFromURL()) {
        resetToDefault();
      }
    }

    // デフォルト配置（手球：ヘッドライン上25%、1番：フットスポット75%）
    function resetToDefault() {
      // 一旦テーブル上のボールをすべてラックに戻す
      document.querySelectorAll('#table-canvas .ball').forEach(b => b.remove());
      
      spawnBallOnTable(0, 25, 50); // 手球
      spawnBallOnTable(1, 75, 50); // 1番球
      
      renderRack();
    }

    // テーブル上にボールを出せる状態にする
    function spawnBallOnTable(id, xPercent, yPercent) {
      let ball = document.getElementById(`ball-${id}`);
      if (!ball) {
        const conf = ballConfigs.find(b => b.id === id);
        ball = document.createElement('div');
        ball.id = `ball-${id}`;
        ball.className = `ball ${conf.class}`;
        ball.innerText = conf.text;
        ball.dataset.id = id;

        ball.addEventListener('mousedown', startDrag);
        ball.addEventListener('touchstart', startDrag, { passive: false });
      }

      ball.style.left = `${xPercent}%`;
      ball.style.top = `${yPercent}%`;
      tableCanvas.appendChild(ball);
      renderRack();
    }

    // ラックの描画（テーブル上にないボールだけ表示）
    function renderRack() {
      ballRack.innerHTML = '';
      ballConfigs.forEach(conf => {
        const isOnTable = document.getElementById(`ball-${conf.id}`);
        if (!isOnTable) {
          const rackBall = document.createElement('div');
          rackBall.className = `rack-ball ${conf.class}`;
          rackBall.innerText = conf.text;
          // ラック内のボールをタップするとテーブルの中央に配置
          rackBall.onclick = () => spawnBallOnTable(conf.id, 50, 50);
          ballRack.appendChild(rackBall);
        }
      });
    }

    // ドラッグ＆ドロップ制御
    function startDrag(e) {
      e.preventDefault();
      activeBall = e.target;
      document.addEventListener('mousemove', drag);
      document.addEventListener('touchmove', drag, { passive: false });
      document.addEventListener('mouseup', stopDrag);
      document.addEventListener('touchend', stopDrag);
    }

    function drag(e) {
      if (!activeBall) return;
      const rect = tableCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let x = ((clientX - rect.left) / rect.width) * 100;
      let y = ((clientY - rect.top) / rect.height) * 100;

      // テーブル枠外（ラック方向）にドラッグした場合はテーブルから除去（ラックに戻す）
      if (x < -5 || x > 105 || y < -10 || y > 110) {
        activeBall.remove();
        stopDrag();
        renderRack();
        return;
      }

      // クッションの内側に収まるようバウンド制限
      x = Math.max(3, Math.min(97, x));
      y = Math.max(5, Math.min(95, y));

      activeBall.style.left = `${x}%`;
      activeBall.style.top = `${y}%`;
    }

    function stopDrag() {
      activeBall = null;
      document.removeEventListener('mousemove', drag);
      document.removeEventListener('touchmove', drag);
    }

    // URL共有機能
    function shareLayout() {
      const activeBalls = document.querySelectorAll('#table-canvas .ball');
      const layoutData = {};
      
      activeBalls.forEach(ball => {
        const id = ball.dataset.id;
        layoutData[id] = {
          x: parseFloat(ball.style.left),
          y: parseFloat(ball.style.top)
        };
      });

      const encoded = encodeURIComponent(btoa(JSON.stringify(layoutData)));
      const shareUrl = `${location.origin}${location.pathname}?layout=${encoded}`;
      
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert('配置の共有URLをコピーしました！');
      });
    }

    function loadLayoutFromURL() {
      const params = new URLSearchParams(window.location.search);
      const layoutParam = params.get('layout');
      if (!layoutParam) return false;

      try {
        const layoutData = JSON.parse(atob(decodeURIComponent(layoutParam)));
        document.querySelectorAll('#table-canvas .ball').forEach(b => b.remove());

        Object.keys(layoutData).forEach(id => {
          spawnBallOnTable(parseInt(id), layoutData[id].x, layoutData[id].y);
        });
        return true;
      } catch (e) {
        console.error('URL解析エラー:', e);
        return false;
      }
    }

    window.onload = init;
  </script>
</body>
</html>
