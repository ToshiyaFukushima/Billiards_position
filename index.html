<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>9ft Billiards Layout with Grid & Snap</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { margin: 0; font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
    h1 { font-size: 1.1rem; margin: 5px 0 10px; color: #ddd; }

    /* 外枠（木枠部分） */
    .table-frame {
      width: 95vw;
      max-width: 700px;
      aspect-ratio: 2.2 / 1.2;
      background: #3a2212;
      border-radius: 12px;
      padding: 4.5% 2.5%;
      position: relative;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* テーブル内側（ラシャ部分：2:1） */
    #table-canvas {
      width: 100%;
      height: 100%;
      background: #0d6b38;
      position: relative;
      border: 4px solid #24140a;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
      overflow: hidden; 
    }

    /* 格子（グリッド） */
    .grid-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      background-size: calc(100% / 8) calc(100% / 4);
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.15) 1px, transparent 1px);
    }

    /* ダイヤ（ポイント）コンテナ */
    #diamonds-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }

    .diamond {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #d4af37;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
      z-index: 1;
    }

    /* ライン・スポット */
    .headline {
      position: absolute;
      left: 25%; top: 0; bottom: 0; width: 1px;
      border-left: 1px dashed rgba(255,255,255,0.3);
      pointer-events: none;
      z-index: 2;
    }

    .foot-spot {
      position: absolute;
      left: 75%; top: 50%; width: 8px; height: 8px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }

    /* ポケット */
    .pocket { position: absolute; background: #111; border-radius: 50%; box-shadow: inset 0 0 8px #000; z-index: 5;}
    .pocket.corner { width: 9%; height: 17%; }
    .pocket.side { width: 8%; height: 13%; }
    .p-tl { top: -4%; left: -3%; }
    .p-tr { top: -4%; right: -3%; }
    .p-bl { bottom: -4%; left: -3%; }
    .p-br { bottom: -4%; right: -3%; }
    .p-tc { top: -6%; left: 50%; transform: translateX(-50%); }
    .p-bc { bottom: -6%; left: 50%; transform: translateX(-50%); }

    /* ボール */
    .ball {
      width: 5.5%; aspect-ratio: 1; border-radius: 50%; position: absolute;
      transform: translate(-50%, -50%); cursor: grab; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 0.75rem; user-select: none; box-shadow: 2px 2px 4px rgba(0,0,0,0.5); z-index: 10;
      transition: left 0.05s ease, top 0.05s ease;
    }
    .ball:active { cursor: grabbing; scale: 1.1; }

    /* ボールデザイン */
    .b-0 { background: #ffffff; color: #000; }
    .b-1 { background: #f1c40f; color: #000; }
    .b-2 { background: #2980b9; color: #fff; }
    .b-3 { background: #e74c3c; color: #fff; }
    .b-4 { background: #8e44ad; color: #fff; }
    .b-5 { background: #e67e22; color: #fff; }
    .b-6 { background: #27ae60; color: #fff; }
    .b-7 { background: #7f8c8d; color: #fff; }
    .b-8 { background: #111111; color: #fff; border: 1px solid #444; }
    .b-9 { background: repeating-linear-gradient(0deg, #f1c40f, #f1c40f 35%, #fff 35%, #fff 65%, #f1c40f 65%); color: #000; }

    /* ラック */
    .rack-container { margin-top: 15px; width: 95vw; max-width: 700px; background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
    .rack-title { font-size: 0.8rem; color: #aaa; margin-bottom: 8px; text-align: center; }
    #ball-rack { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 40px; align-items: center; }
    .rack-ball { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.75rem; cursor: pointer; box-shadow: 1px 1px 3px rgba(0,0,0,0.4); user-select: none; }

    /* コントロール・スナップトグル */
    .controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 9px 14px;
      border-radius: 5px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .toggle-label input { accent-color: #27ae60; width: 16px; height: 16px; cursor: pointer; }
    button { padding: 10px 18px; font-size: 0.85rem; border: none; border-radius: 5px; background: #27ae60; color: white; cursor: pointer; font-weight: bold; }
    button.reset { background: #c0392b; }
  </style>
</head>
<body>

  <h1>9ft Billiards Layout & Grid Snap</h1>

  <div class="table-frame" id="table-frame">
    <div id="diamonds-container"></div>
    <div id="table-canvas">
      <div class="grid-overlay"></div>
      <div class="headline"></div>
      <div class="foot-spot"></div>

      <div class="pocket corner p-tl"></div>
      <div class="pocket side p-tc"></div>
      <div class="pocket corner p-tr"></div>
      <div class="pocket corner p-bl"></div>
      <div class="pocket side p-bc"></div>
      <div class="pocket corner p-br"></div>
    </div>
  </div>

  <div class="rack-container">
    <div class="rack-title">ボールラック（タップで配置 / 枠外ドラッグで戻す）</div>
    <div id="ball-rack"></div>
  </div>

  <div class="controls">
    <!-- グリッド吸着トグル -->
    <label class="toggle-label">
      <input type="checkbox" id="snap-toggle" onchange="toggleSnap(this.checked)">
      <span>グリッドに吸着</span>
    </label>
    <button onclick="shareLayout()">共有URLをコピー</button>
    <button class="reset" onclick="resetToDefault()">初期配置に戻す</button>
  </div>

  <script>
    const tableCanvas = document.getElementById('table-canvas');
    const tableFrame = document.getElementById('table-frame');
    const diamondsContainer = document.getElementById('diamonds-container');
    const ballRack = document.getElementById('ball-rack');
    let activeBall = null;
    let isSnapEnabled = false;

    const ballConfigs = [
      { id: 0, text: '手', class: 'b-0' }, { id: 1, text: '1', class: 'b-1' }, { id: 2, text: '2', class: 'b-2' }, { id: 3, text: '3', class: 'b-3' },
      { id: 4, text: '4', class: 'b-4' }, { id: 5, text: '5', class: 'b-5' }, { id: 6, text: '6', class: 'b-6' }, { id: 7, text: '7', class: 'b-7' },
      { id: 8, text: '8', class: 'b-8' }, { id: 9, text: '9', class: 'b-9' }
    ];

    function createDiamonds() {
      for (let i = 1; i < 8; i++) {
        addDiamond(diamondsContainer, `calc(2.5% + (95% * ${i} / 8))`, '2.5%');
        addDiamond(diamondsContainer, `calc(2.5% + (95% * ${i} / 8))`, '97.5%');
      }
      for (let i = 1; i < 4; i++) {
        addDiamond(diamondsContainer, '1.2%', `calc(4.5% + (91% * ${i} / 4))`);
        addDiamond(diamondsContainer, '98.8%', `calc(4.5% + (91% * ${i} / 4))`);
      }
    }

    function addDiamond(container, x, y) {
      const diamond = document.createElement('div');
      diamond.className = 'diamond';
      diamond.style.left = x;
      diamond.style.top = y;
      container.appendChild(diamond);
    }

    function toggleSnap(enabled) {
      isSnapEnabled = enabled;
    }

    // 最寄りのグリッド交点（長辺8分割・短辺4分割）へ位置補正
    function getSnappedPosition(x, y) {
      const stepX = 100 / 8; // 12.5%
      const stepY = 100 / 4; // 25.0%

      let snappedX = Math.round(x / stepX) * stepX;
      let snappedY = Math.round(y / stepY) * stepY;

      return { x: snappedX, y: snappedY };
    }

    function init() {
      createDiamonds();
      renderRack();
      if (!loadLayoutFromURL()) {
        resetToDefault();
      }
    }

    function resetToDefault() {
      document.querySelectorAll('#table-canvas .ball').forEach(b => b.remove());
      spawnBallOnTable(0, 25, 50);
      spawnBallOnTable(1, 75, 50);
      renderRack();
    }

    function spawnBallOnTable(id, xPercent, yPercent) {
      let ball = document.getElementById(`ball-${id}`);
      if (!ball) {
        const conf = ballConfigs.find(b => b.id === id);
        ball = document.createElement('div');
        ball.id = `ball-${id}`;
        ball.className = `ball ${conf.class}`;
        ball.innerText = conf.text;
        ball.dataset.id = id;
        ball.addEventListener('mousedown', startDrag);
        ball.addEventListener('touchstart', startDrag, { passive: false });
      }

      if (isSnapEnabled) {
        const snapped = getSnappedPosition(xPercent, yPercent);
        xPercent = snapped.x;
        yPercent = snapped.y;
      }

      ball.style.left = `${xPercent}%`;
      ball.style.top = `${yPercent}%`;
      tableCanvas.appendChild(ball);
      renderRack();
    }

    function renderRack() {
      ballRack.innerHTML = '';
      ballConfigs.forEach(conf => {
        const isOnTable = document.getElementById(`ball-${conf.id}`);
        if (!isOnTable) {
          const rackBall = document.createElement('div');
          rackBall.className = `rack-ball ${conf.class}`;
          rackBall.innerText = conf.text;
          rackBall.onclick = () => spawnBallOnTable(conf.id, 50, 50);
          ballRack.appendChild(rackBall);
        }
      });
    }

    function startDrag(e) {
      e.preventDefault();
      activeBall = e.target;
      document.addEventListener('mousemove', drag);
      document.addEventListener('touchmove', drag, { passive: false });
      document.addEventListener('mouseup', stopDrag);
      document.addEventListener('touchend', stopDrag);
    }

    function drag(e) {
      if (!activeBall) return;
      const rect = tableCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let x = ((clientX - rect.left) / rect.width) * 100;
      let y = ((clientY - rect.top) / rect.height) * 100;

      // ラックに戻す判定（外枠へ大きく出たとき）
      if (x < -8 || x > 108 || y < -12 || y > 112) {
        activeBall.remove();
        stopDrag();
        renderRack();
        return;
      }

      // スナップ機能がONの場合は最寄りの交点にピタッと吸着
      if (isSnapEnabled) {
        const snapped = getSnappedPosition(x, y);
        x = snapped.x;
        y = snapped.y;
      } else {
        // OFFの場合は自由配置（枠内制限のみ）
        x = Math.max(3, Math.min(97, x));
        y = Math.max(5, Math.min(95, y));
      }

      activeBall.style.left = `${x}%`;
      activeBall.style.top = `${y}%`;
    }

    function stopDrag() {
      activeBall = null;
      document.removeEventListener('mousemove', drag);
      document.removeEventListener('touchmove', drag);
    }

    function shareLayout() {
      const activeBalls = document.querySelectorAll('#table-canvas .ball');
      const layoutData = {};
      activeBalls.forEach(ball => { layoutData[ball.dataset.id] = { x: parseFloat(ball.style.left), y: parseFloat(ball.style.top) }; });
      const encoded = encodeURIComponent(btoa(JSON.stringify(layoutData)));
      const shareUrl = `${location.origin}${location.pathname}?layout=${encoded}`;
      navigator.clipboard.writeText(shareUrl).then(() => { alert('配置の共有URLをコピーしました！'); });
    }

    function loadLayoutFromURL() {
      const params = new URLSearchParams(window.location.search);
      const layoutParam = params.get('layout');
      if (!layoutParam) return false;
      try {
        const layoutData = JSON.parse(atob(decodeURIComponent(layoutParam)));
        document.querySelectorAll('#table-canvas .ball').forEach(b => b.remove());
        Object.keys(layoutData).forEach(id => { spawnBallOnTable(parseInt(id), layoutData[id].x, layoutData[id].y); });
        return true;
      } catch (e) { return false; }
    }

    window.onload = init;
  </script>
</body>
</html>
