<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>9ft Billiards Layout Editor</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { margin: 0; font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
    h1 { font-size: 1.1rem; margin: 5px 0 10px; color: #ddd; }

    /* メタリック外枠フレーム */
    .table-container {
      width: 95vw;
      max-width: 720px;
      aspect-ratio: 2.15 / 1.15;
      position: relative;
      background: linear-gradient(135deg, #d8dce1 0%, #9aa0a6 50%, #6c737e 100%);
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 2px 3px rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 四隅の金属コーナーパーツ */
    .metal-corner {
      position: absolute;
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ffffff 0%, #b8bec7 50%, #7e8692 100%);
      border: 1px solid #6b727d;
      box-shadow: inset 0 0 3px rgba(255,255,255,0.9), 0 2px 4px rgba(0,0,0,0.4);
      z-index: 20;
    }
    .mc-tl { top: 2px; left: 2px; border-top-left-radius: 8px; }
    .mc-tr { top: 2px; right: 2px; border-top-right-radius: 8px; }
    .mc-bl { bottom: 2px; left: 2px; border-bottom-left-radius: 8px; }
    .mc-br { bottom: 2px; right: 2px; border-bottom-right-radius: 8px; }

    /* 木目調レール */
    .wood-rail {
      width: 100%;
      height: 100%;
      background: #472b17;
      background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 10px);
      border-radius: 4px;
      padding: 16px; /* クッションまでの木枠幅 */
      position: relative;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* テーブル内側（ラシャ：エメラルドグリーン） */
    #table-canvas {
      width: 100%;
      height: 100%;
      background: #009a7b;
      position: relative;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
      overflow: hidden;
      border-radius: 2px;
    }

    /* クッションの影 */
    .cushion-shadow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
      z-index: 3;
    }

    /* 格子（グリッド） */
    .grid-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-size: calc(100% / 16) calc(100% / 8);
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.18) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.18) 1px, transparent 1px);
      z-index: 2;
    }

    /* ヘッドスポット & フットスポット (白点) */
    .table-spot {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 2px rgba(0,0,0,0.6);
      pointer-events: none;
      z-index: 3;
    }
    .head-spot { left: 25%; top: 50%; }
    .foot-spot { left: 75%; top: 50%; }

    /* 木枠上の白い菱形ダイヤ */
    .diamond {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #ffffff;
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow: 0 0 2px rgba(0,0,0,0.7);
      z-index: 15;
    }

    /* ポケット (6穴) */
    .pocket {
      position: absolute;
      background: #080808;
      border-radius: 50%;
      box-shadow: inset 0 0 8px #000000;
      z-index: 8;
    }
    .pocket.corner { width: 8.5%; aspect-ratio: 1; }
    .pocket.side { width: 7.5%; aspect-ratio: 1; }
    .p-tl { top: -3.5%; left: -3.5%; }
    .p-tr { top: -3.5%; right: -3.5%; }
    .p-bl { bottom: -3.5%; left: -3.5%; }
    .p-br { bottom: -3.5%; right: -3.5%; }
    .p-tc { top: -4.5%; left: 50%; transform: translateX(-50%); }
    .p-bc { bottom: -4.5%; left: 50%; transform: translateX(-50%); }

    /* ボール */
    .ball {
      width: 5.5%; aspect-ratio: 1; border-radius: 50%; position: absolute;
      transform: translate(-50%, -50%); cursor: grab; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 0.75rem; user-select: none; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); z-index: 10;
      transition: left 0.05s ease, top 0.05s ease;
    }
    .ball:active { cursor: grabbing; scale: 1.1; }

    /* ボール配色 */
    .b-0 { background: #ffffff; color: #000; }
    .b-1 { background: #f1c40f; color: #000; }
    .b-2 { background: #2980b9; color: #fff; }
    .b-3 { background: #e74c3c; color: #fff; }
    .b-4 { background: #8e44ad; color: #fff; }
    .b-5 { background: #e67e22; color: #fff; }
    .b-6 { background: #27ae60; color: #fff; }
    .b-7 { background: #7f8c8d; color: #fff; }
    .b-8 { background: #111111; color: #fff; border: 1px solid #444; }
    .b-9 { background: repeating-linear-gradient(0deg, #f1c40f, #f1c40f 35%, #fff 35%, #fff 65%, #f1c40f 65%); color: #000; }

    /* ラック */
    .rack-container { margin-top: 15px; width: 95vw; max-width: 720px; background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
    .rack-title { font-size: 0.8rem; color: #aaa; margin-bottom: 8px; text-align: center; }
    #ball-rack { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 40px; align-items: center; }
    .rack-ball { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.75rem; cursor: pointer; box-shadow: 1px 1px 3px rgba(0,0,0,0.4); user-select: none; }

    /* コントロール */
    .controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 7px 12px;
      border-radius: 5px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .toggle-label input { accent-color: #27ae60; width: 16px; height: 16px; cursor: pointer; }
    select {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
    }
    button { padding: 9px 16px; font-size: 0.85rem; border: none; border-radius: 5px; background: #c0392b; color: white; cursor: pointer; font-weight: bold; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>

  <h1>9ft Billiards Layout Editor</h1>

  <!-- テーブル全体（金属外枠） -->
  <div class="table-container">
    <div class="metal-corner mc-tl"></div>
    <div class="metal-corner mc-tr"></div>
    <div class="metal-corner mc-bl"></div>
    <div class="metal-corner mc-br"></div>

    <!-- 木目調レール -->
    <div class="wood-rail" id="wood-rail">
      <!-- ラシャ（プレイフィールド） -->
      <div id="table-canvas">
        <div class="cushion-shadow"></div>
        <div class="grid-overlay" id="grid-overlay"></div>
        
        <!-- ヘッドスポット & フットスポット -->
        <div class="table-spot head-spot"></div>
        <div class="table-spot foot-spot"></div>

        <!-- 6つのポケット -->
        <div class="pocket corner p-tl"></div>
        <div class="pocket side p-tc"></div>
        <div class="pocket corner p-tr"></div>
        <div class="pocket corner p-bl"></div>
        <div class="pocket side p-bc"></div>
        <div class="pocket corner p-br"></div>
      </div>
    </div>
  </div>

  <div class="rack-container">
    <div class="rack-title">ボールラック（タップで配置 / 枠外ドラッグで戻す）</div>
    <div id="ball-rack"></div>
  </div>

  <div class="controls">
    <label class="toggle-label">
      <input type="checkbox" id="snap-toggle" onchange="toggleSnap(this.checked)">
      <span>グリッド吸着</span>
    </label>

    <label class="toggle-label">
      <span>精度:</span>
      <select id="grid-density" onchange="updateGridDensity(this.value)">
        <option value="1">1ダイヤ (8×4)</option>
        <option value="0.5" selected>0.5ダイヤ (16×8)</option>
        <option value="0.25">0.25ダイヤ (32×16)</option>
      </select>
    </label>

    <button onclick="resetToDefault()">初期配置に戻す</button>
  </div>

  <script>
    const tableCanvas = document.getElementById('table-canvas');
    const woodRail = document.getElementById('wood-rail');
    const gridOverlay = document.getElementById('grid-overlay');
    const ballRack = document.getElementById('ball-rack');
    
    let activeBall = null;
    let isSnapEnabled = false;
    let gridStep = 0.5;

    const ballConfigs = [
      { id: 0, text: '手', class: 'b-0' }, { id: 1, text: '1', class: 'b-1' }, { id: 2, text: '2', class: 'b-2' }, { id: 3, text: '3', class: 'b-3' },
      { id: 4, text: '4', class: 'b-4' }, { id: 5, text: '5', class: 'b-5' }, { id: 6, text: '6', class: 'b-6' }, { id: 7, text: '7', class: 'b-7' },
      { id: 8, text: '8', class: 'b-8' }, { id: 9, text: '9', class: 'b-9' }
    ];

    // 木目レール上にダイヤ（ポイント）を正確に配置
    function createDiamonds() {
      // 長辺 (7個ずつ)
      for (let i = 1; i < 8; i++) {
        addDiamond(woodRail, `calc(16px + (100% - 32px) * ${i} / 8)`, '8px');
        addDiamond(woodRail, `calc(16px + (100% - 32px) * ${i} / 8)`, 'calc(100% - 8px)');
      }
      // 短辺 (3個ずつ)
      for (let i = 1; i < 4; i++) {
        addDiamond(woodRail, '8px', `calc(16px + (100% - 32px) * ${i} / 4)`);
        addDiamond(woodRail, 'calc(100% - 8px)', `calc(16px + (100% - 32px) * ${i} / 4)`);
      }
    }

    function addDiamond(container, x, y) {
      const diamond = document.createElement('div');
      diamond.className = 'diamond';
      diamond.style.left = x;
      diamond.style.top = y;
      container.appendChild(diamond);
    }

    function toggleSnap(enabled) { isSnapEnabled = enabled; }

    function updateGridDensity(value) {
      gridStep = parseFloat(value);
      const cols = 8 / gridStep;
      const rows = 4 / gridStep;
      gridOverlay.style.backgroundSize = `calc(100% / ${cols}) calc(100% / ${rows})`;
    }

    function getSnappedPosition(x, y) {
      const cols = 8 / gridStep;
      const rows = 4 / gridStep;
      const stepX = 100 / cols;
      const stepY = 100 / rows;
      return {
        x: Math.round(x / stepX) * stepX,
        y: Math.round(y / stepY) * stepY
      };
    }

    function init() {
      createDiamonds();
      updateGridDensity(document.getElementById('grid-density').value);
      resetToDefault();
    }

    function resetToDefault() {
      document.querySelectorAll('#table-canvas .ball').forEach(b => b.remove());
      spawnBallOnTable(0, 25, 50); // 手球（ヘッドスポット上）
      spawnBallOnTable(1, 75, 50); // 1番球（フットスポット上）
      renderRack();
    }

    function spawnBallOnTable(id, xPercent, yPercent) {
      let ball = document.getElementById(`ball-${id}`);
      if (!ball) {
        const conf = ballConfigs.find(b => b.id === id);
        ball = document.createElement('div');
        ball.id = `ball-${id}`;
        ball.className = `ball ${conf.class}`;
        ball.innerText = conf.text;
        ball.dataset.id = id;
        ball.addEventListener('mousedown', startDrag);
        ball.addEventListener('touchstart', startDrag, { passive: false });
      }

      if (isSnapEnabled) {
        const snapped = getSnappedPosition(xPercent, yPercent);
        xPercent = snapped.x;
        yPercent = snapped.y;
      }

      ball.style.left = `${xPercent}%`;
      ball.style.top = `${yPercent}%`;
      tableCanvas.appendChild(ball);
      renderRack();
    }

    function renderRack() {
      ballRack.innerHTML = '';
      ballConfigs.forEach(conf => {
        const isOnTable = document.getElementById(`ball-${conf.id}`);
        if (!isOnTable) {
          const rackBall = document.createElement('div');
          rackBall.className = `rack-ball ${conf.class}`;
          rackBall.innerText = conf.text;
          rackBall.onclick = () => spawnBallOnTable(conf.id, 50, 50);
          ballRack.appendChild(rackBall);
        }
      });
    }

    function startDrag(e) {
      e.preventDefault();
      activeBall = e.target;
      document.addEventListener('mousemove', drag);
      document.addEventListener('touchmove', drag, { passive: false });
      document.addEventListener('mouseup', stopDrag);
      document.addEventListener('touchend', stopDrag);
    }

    function drag(e) {
      if (!activeBall) return;
      const rect = tableCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let x = ((clientX - rect.left) / rect.width) * 100;
      let y = ((clientY - rect.top) / rect.height) * 100;

      if (x < -8 || x > 108 || y < -12 || y > 112) {
        activeBall.remove();
        stopDrag();
        renderRack();
        return;
      }

      if (isSnapEnabled) {
        const snapped = getSnappedPosition(x, y);
        x = snapped.x;
        y = snapped.y;
      } else {
        x = Math.max(3, Math.min(97, x));
        y = Math.max(5, Math.min(95, y));
      }

      activeBall.style.left = `${x}%`;
      activeBall.style.top = `${y}%`;
    }

    function stopDrag() {
      activeBall = null;
      document.removeEventListener('mousemove', drag);
      document.removeEventListener('touchmove', drag);
    }

    window.onload = init;
  </script>
</body>
</html>
